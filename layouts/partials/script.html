<script type="application/javascript" src="{{ "js/github-style.js" | absURL }}"></script>
{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
  integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"
  integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"
  onload="renderMathInElement(document.body);"></script>
{{ end }}

{{ if or .Params.MathJax .Site.Params.MathJax }}
<script type="text/javascript" async
  src="https://cdn.bootcss.com/mathjax/2.7.3/MathJax.js?config=TeX-AMS-MML_HTMLorMML">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\[\[', '\]\]']],
        processEscapes: true,
        processEnvironments: true,
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        TeX: {
          equationNumbers: { autoNumber: "AMS" },
          extensions: ["AMSmath.js", "AMSsymbols.js"]
        }
      }
    });

    MathJax.Hub.Queue(function () {
      // Fix <code> tags after MathJax finishes running. This is a
      // hack to overcome a shortcoming of Markdown. Discussion at
      // https://github.com/mojombo/jekyll/issues/199
      var all = MathJax.Hub.getAllJax(), i;
      for (i = 0; i < all.length; i += 1) {
        all[i].SourceElement().parentNode.className += ' has-jax';
      }
    });
  </script>

<style>
  code.has-jax {
    font: inherit;
    font-size: 100%;
    background: inherit;
    border: inherit;
    color: #515151;
  }
</style>
{{ end }}

{{ if .Site.Params.enableSearch }}
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
<script type="application/javascript" src='{{ "js/search.js" | absURL }}'></script>
{{ end }}

{{ if or .Params.mermaid .Site.Params.mermaid }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  (function () {
    function initMermaid() {
      if (!window.mermaid) return;
      var mode = document.documentElement.getAttribute('data-color-mode') || 'light';
      var isDark = mode === 'dark';
      var accent = '#0ea5a4'; // teal accent that contrasts on light and dark
      var textLight = '#0f172a'; // slate-900
      var textDark = '#f8fafc';  // slate-50
      window.mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        themeVariables: {
          lineColor: accent,
          arrowheadColor: accent,
          textColor: isDark ? textDark : textLight,
          primaryTextColor: isDark ? textDark : textLight,
          edgeLabelBackground: 'transparent'
        }
      });
      // (Re)render all mermaid blocks
      var els = document.querySelectorAll('.mermaid');
      window.mermaid.init(undefined, els);
    }

    try {
      // Convert fenced code blocks to .mermaid containers once
      var blocks = document.querySelectorAll('code.language-mermaid');
      blocks.forEach(function (code) {
        var pre = code.parentElement;
        var container = document.createElement('div');
        container.className = 'mermaid';
        container.textContent = code.textContent;
        pre.replaceWith(container);
      });
      initMermaid();
      // Re-init when the site theme toggles
      var mo = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.type === 'attributes' && m.attributeName === 'data-color-mode') {
            initMermaid();
          }
        });
      });
      mo.observe(document.documentElement, { attributes: true });
    } catch (e) { /* no-op */ }
  })();
  </script>
{{ end }}
